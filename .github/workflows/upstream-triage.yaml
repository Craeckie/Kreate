name: Upstream triage

# Answers "did knighthat/Kreate push anything we want?" without anyone having to
# remember to look. Runs scripts/upstream_check.py and keeps a single issue up to
# date with the outstanding code commits; closes it when there is nothing left.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/knighthat/Kreate.git || true
          git fetch upstream --tags --no-recurse-submodules

      - name: Triage
        id: triage
        run: |
          # --no-probe: the runner has no submodules checked out, so a cherry-pick
          # dry run would report spurious conflicts on the pointer files.
          python3 scripts/upstream_check.py --no-fetch --no-probe > report.txt
          echo "count=$(grep -c '^  [0-9a-f]\{9\}' report.txt || true)" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open or update the triage issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '```\n' + fs.readFileSync('report.txt', 'utf8') + '```\n';
            const title = 'Upstream triage: commits not yet evaluated';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'upstream-triage',
            });
            const nothing = body.includes('Nothing outstanding worth a look.');
            if (issues.length === 0) {
              if (nothing) return;
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['upstream-triage'],
              });
            } else {
              await github.rest.issues.update({
                ...context.repo, issue_number: issues[0].number, title, body,
                state: nothing ? 'closed' : 'open',
              });
            }
