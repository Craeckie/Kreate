# Robolectric defaults to instantiating the manifest-declared Application class
# (it.fast4x.rimusic.MainApplication), which eagerly starts Koin, installs a
# CrashHandler, etc. That's real-app initialization a unit test should not trigger,
# and since Koin's GlobalContext is a JVM-wide singleton, a second test method
# instantiating a fresh MainApplication crashes with
# KoinApplicationAlreadyStartedException. Use a bare Application for unit tests.
application=android.app.Application
